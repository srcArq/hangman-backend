spring.application.name=hangman
server.port=${PORT:8080}

# Secreto para cifrar el token de partida (AES-GCM). En producción DEBE
# sobreescribirse con la variable de entorno HANGMAN_TOKEN_SECRET (un valor
# largo y aleatorio). El valor por defecto es solo para desarrollo local.
hangman.token.secret=${HANGMAN_TOKEN_SECRET:dev-only-insecure-secret-change-me}

# Orígenes permitidos por CORS (separados por comas). Ajusta con HANGMAN_CORS_ORIGINS.
hangman.cors.allowed-origins=${HANGMAN_CORS_ORIGINS:http://localhost:4321,https://hangman-frontend-sable.vercel.app}

# Actuator: exponer solo el health check (útil para Cloud Run).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
